name: Coverage Report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  run-coverage-report:
    name: CoverageReport

    timeout-minutes: 10

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Run tests and generate coverage report
        run: |
          coverage run --source=. -m unittest discover
          coverage report -m > coverage_report.txt

      - name: Comment on PR with coverage report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const coverageReportPath = path.join(process.env.GITHUB_WORKSPACE, 'coverage_report.txt');
            const coverageReport = fs.readFileSync(coverageReportPath, 'utf8');
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Coverage Report:\n\`\`\`\n${coverageReport}\n\`\`\``
            });
